name: Lua Format

on: [push, pull_request]

jobs:
  stylua:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # The runner image provides rustup; actions-rs/toolchain is archived.
      - name: Install Rust toolchain
        run: rustup toolchain install stable --profile minimal && rustup default stable

      - name: Install Stylua
        run: cargo install stylua --locked
        
      - name: Run Stylua format file by file
        run: |
          # depuis la racine du dépôt, formate tous les .lua sous MultiBot
          find . -type f -name "*.lua" -not -path "./.git/*" -print0 |
          while IFS= read -r -d '' file; do
            echo "➡️ Formatting $file"
            stylua "$file"
          done