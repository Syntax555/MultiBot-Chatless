name: Latest

# Every push to main publishes the rolling Latest release with MultiBot-Chatless-latest.zip.
# The previous assets stay downloadable until the new ZIP is built and checked.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: latest
  cancel-in-progress: false

jobs:
  latest:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - name: Install Lua 5.1
        run: sudo apt-get update -qq && sudo apt-get install -y -qq lua5.1 > /dev/null

      - name: Check Lua syntax and package
        run: python3 .github/scripts/package_latest.py --addon .:MultiBot.toc:MultiBot --luac luac5.1 --output "MultiBot-Chatless-latest.zip"

      - name: Publish the Latest release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          notes="$RUNNER_TEMP/notes.md"
          {
            echo "Rolling build of \`main\` at ${GITHUB_SHA::12}."
            echo
            cat .github/release-notes.md
          } > "$notes"
          if gh release view latest > /dev/null 2>&1; then
            gh release upload latest "MultiBot-Chatless-latest.zip" --clobber
            git tag -f latest "$GITHUB_SHA"
            git push --force origin refs/tags/latest
            gh release edit latest --title Latest --notes-file "$notes" --latest
          else
            gh release create latest "MultiBot-Chatless-latest.zip" --target "$GITHUB_SHA" --title Latest --notes-file "$notes" --latest
          fi
